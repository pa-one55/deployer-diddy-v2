<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deployer-diddy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 3rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #e0e0e0;
      color: #0f0f0f;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>deployer-diddy</h1>
    <p>Deploy your GitHub repos to EC2 with Docker. One click.</p>
    <a href="#" class="btn" id="loginBtn">Login with GitHub</a>
  </div>

  <script>
    const GITHUB_CLIENT_ID = 'Ov23liaWz9JLuiIKJtDL';

    document.getElementById('loginBtn').addEventListener('click', (e) => {
      e.preventDefault();
      const redirectUri = encodeURIComponent(window.location.origin + '/api/auth/callback');
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${GITHUB_CLIENT_ID}&redirect_uri=${redirectUri}&scope=repo`;
    });
  </script>
</body>
</html>
